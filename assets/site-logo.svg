<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Spades Universe</title>
  <desc id="desc">Gold Spades Universe emblem with the words Learn, Play, Compete.</desc>
  <defs>
    <linearGradient id="gold" x1="340" y1="90" x2="650" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4b0"/>
      <stop offset=".43" stop-color="#e8bd50"/>
      <stop offset="1" stop-color="#9c6817"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#e8bd50" stop-opacity=".26"/>
      <stop offset="1" stop-color="#e8bd50" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>
  <ellipse cx="500" cy="330" rx="360" ry="300" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <circle cx="500" cy="298" r="214" fill="#082d24" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="500" cy="298" r="192" fill="none" stroke="#f3d479" stroke-width="2" opacity=".55"/>
    <path d="M500 113c-29 49-119 111-119 182 0 41 31 70 69 70 19 0 36-7 50-22-3 33-14 50-46 63h92c-32-13-43-30-46-63 14 15 31 22 50 22 38 0 69-29 69-70 0-71-90-133-119-182Z" fill="url(#gold)"/>
    <path d="m434 134 29 25 37-45 37 45 29-25 17 64H417l17-64Z" fill="url(#gold)"/>
  </g>
  <text x="500" y="572" text-anchor="middle" fill="#f7e7a2" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="75" letter-spacing="5">SPADES</text>
  <text x="500" y="638" text-anchor="middle" fill="#e4b94d" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="48" letter-spacing="13">UNIVERSE</text>
  <path d="M288 675h424" stroke="#d9aa3c" stroke-width="2" opacity=".65"/>
  <text x="500" y="715" text-anchor="middle" fill="#d6e4de" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="8">LEARN  •  PLAY  •  COMPETE</text>
</svg>
